name: youtube
# Uploads the next videos of agendamento/calendar.json as private + scheduled (publishAt).
# Runs daily after the YouTube quota resets (midnight Pacific, 07:00 UTC).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (test the credentials), upload (calendar) or lote (long videos 01-10 only)"
        required: true
        default: check
  schedule:
    - cron: "10 7 * * *"
permissions:
  contents: write
concurrency: youtube
jobs:
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      EBOOK_URL: ${{ vars.EBOOK_URL }}
      YT_BUDGET: ${{ vars.YT_BUDGET }}
      YT_SHORTS: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests
      - run: python pipeline/yt_upload.py ${{ inputs.mode || 'upload' }}
      - name: Save what was uploaded
        if: always()
        run: |
          git config user.name "upload-bot" && git config user.email "upload-bot@users.noreply.github.com"
          python pipeline/export_plan.py || true
          git add agendamento/plano 2>/dev/null || true
          git add agendamento/youtube-state.json agendamento/youtube-check.txt 2>/dev/null || git add agendamento/youtube-state.json || exit 0
          git diff --cached --quiet || (git commit -qm "youtube: upload state" && for i in 1 2 3 4 5; do git pull -q --rebase && git push && break; sleep 5; done)
