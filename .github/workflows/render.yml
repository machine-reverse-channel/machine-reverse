name: render
on:
  push:
    branches: [machine-reverse]
    paths: [jobs/render.txt]
  workflow_dispatch:
    inputs:
      video:
        description: "folder name under videos/"
        required: true
        default: test30
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Which job
        run: echo "JOB=${{ inputs.video || '' }}" >> $GITHUB_ENV && [ -n "${{ inputs.video }}" ] || echo "JOB=$(head -1 jobs/render.txt | tr -d '[:space:]')" >> $GITHUB_ENV
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install piper-tts requests pillow
          mkdir -p voices && cd voices
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high
          curl -sSLO $B/en_US-ryan-high.onnx && curl -sSLO $B/en_US-ryan-high.onnx.json
      - name: Fetch real photos (Wikimedia Commons)
        run: set -o pipefail; python pipeline/fetch_media.py "$JOB" 2>&1 | tee /tmp/fetch.log
      - name: Publish the log when the download fails
        if: failure()
        run: |
          git config user.name "render-bot" && git config user.email "render-bot@users.noreply.github.com"
          git checkout --orphan lg && git rm -rf -q . && cp /tmp/fetch.log fetch.log
          git add -f fetch.log && git commit -q -m "render log $JOB" && git push -f origin lg:renderlog-$JOB
      - name: Render
        run: python pipeline/build.py "$JOB"
      - name: Cut 5 vertical Shorts
        run: python pipeline/shorts.py "$JOB"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JOB }}
          path: |
            videos/${{ env.JOB }}/out/${{ env.JOB }}.mp4
            videos/${{ env.JOB }}/out/preview.mp4
            videos/${{ env.JOB }}/out/captions.srt
            videos/${{ env.JOB }}/credits.json
            videos/${{ env.JOB }}/out/chapters.txt
            videos/${{ env.JOB }}/out/shorts/*.mp4
            videos/${{ env.JOB }}/out/shorts/shorts.md
      - name: Publish to the deliveries branch (video split in parts under 90 MB)
        run: |
          V="$JOB"
          mkdir -p /tmp/out/media /tmp/out/parts
          cp videos/$V/out/preview.mp4 videos/$V/out/captions.srt videos/$V/out/chapters.txt videos/$V/out/frame*.jpg videos/$V/credits.json /tmp/out/
          cp videos/$V/media/*.jpg /tmp/out/media/
          mkdir -p /tmp/out/shorts && cp videos/$V/out/shorts/*.mp4 videos/$V/out/shorts/shorts.md /tmp/out/shorts/
          split -b 90M -d -a 2 videos/$V/out/$V.mp4 /tmp/out/parts/$V.mp4.part
          git config user.name "render-bot" && git config user.email "render-bot@users.noreply.github.com"
          git checkout --orphan deliveries-new && git rm -rf -q . && mkdir -p deliveries/$V && cp -r /tmp/out/* deliveries/$V/
          git add -f deliveries && git commit -q -m "deliver $V" && git push -f origin deliveries-new:deliveries-$V
